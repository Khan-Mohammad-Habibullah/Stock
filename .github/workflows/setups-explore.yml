name: Setups data dump (exploration)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/setups_data.py study_data.json.gz
      - name: Publish the dump on its own branch
        run: |
          git config user.name "setups-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan study-data
          git rm -rf -q . 
          git add study_data.json.gz
          git commit -q -m "Setups study data dump ($(date -u +%F))"
          git push -f origin study-data
