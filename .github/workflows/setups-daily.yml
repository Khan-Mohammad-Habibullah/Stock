name: Update setups before 20% rises (daily)

# Rebuilds the list of current candidates (Table C of "Setups before 20% rises" on the Strategy tab) from completed daily candles,
# once per trading day at 06:00 Stockholm time, Tuesday to Saturday, after all seven markets have closed.
# 06:00 Stockholm is 05:00 UTC in winter and 04:00 UTC in summer, so there are runs at both and the script skips the one that
# is too early (before 06:00 local) or that comes after the day's rebuild; a later fallback covers a dropped run.
on:
  schedule:
    - cron: "0 4 * * 2-6"
    - cron: "0 5 * * 2-6"
    - cron: "30 6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: board-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Rebuild the candidates
        run: python3 scripts/setups_daily.py
      - name: Commit and push
        run: |
          git config user.name "setups-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/setups.json data/setups_log.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Rebuild setup candidates ($(date -u +%F))"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
