name: Fetch market flows

# One-off data pull for the new "Where money is moving" markets (Denmark,
# Finland, Germany, Canada). Runs on push of the script or by hand; the
# result is committed as data/market_flows.json and baked into index.html
# separately (scripts/bake_market_flows.py).
on:
  push:
    branches: [main]
    paths: [scripts/fetch_market_flows.py, .github/workflows/fetch-market-flows.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-market-flows
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and compute
        run: python3 scripts/fetch_market_flows.py

      - name: Commit result
        run: |
          git config user.name "market-flows-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market_flows.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Market flows for Denmark, Finland, Germany, Canada"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
